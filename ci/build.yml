# GitHub Actions workflow: host tests + PlatformIO builds on every push.
# To turn it on, move this file to .github/workflows/build.yml
# (git mv ci/build.yml .github/workflows/build.yml).
name: Build

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host tests (UI, settings, grind by weight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test/host/run.sh

  firmware:
    name: Firmware (PlatformIO, MKR WiFi 1010)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Build without Wi-Fi (no secrets.h)
        run: pio run -e mkrwifi1010
      - name: Build with Wi-Fi + Home Assistant (example secrets)
        run: |
          cp include/secrets.example.h include/secrets.h
          pio run -e mkrwifi1010 -t clean
          pio run -e mkrwifi1010
